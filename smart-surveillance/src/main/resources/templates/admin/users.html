<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Management — Smart Surveillance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-content">

    <div class="page-header">
        <h2>User Management</h2>
        <a th:href="@{/admin/users/add}" class="btn btn-primary">+ Register New User</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-error"   th:text="${errorMessage}"></div>

    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="no-data">No users found.</td>
                </tr>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td>
                        <span th:text="${user.role}"
                              th:classappend="${user.role.name() == 'ADMIN'} ? 'badge badge-primary' : 'badge badge-info'">
                        </span>
                    </td>
                    <td>
                        <span th:text="${user.enabled ? 'Active' : 'Disabled'}"
                              th:classappend="${user.enabled} ? 'badge badge-success' : 'badge badge-secondary'">
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}"
                              method="post"
                              style="display:inline">
                            <button type="submit"
                                    th:text="${user.enabled ? 'Disable' : 'Enable'}"
                                    th:classappend="${user.enabled} ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-success'">
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
