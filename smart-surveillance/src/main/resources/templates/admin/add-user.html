<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register User — Smart Surveillance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-content">

    <div class="page-header">
        <h2>Register New User</h2>
        <a th:href="@{/admin/users}" class="btn btn-outline">← Back to Users</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="form-card">
        <form th:action="@{/admin/users/add}" method="post" class="record-form">

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter username"
                       required/>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password (min 6 characters)"
                       minlength="6"
                       required/>
            </div>

            <div class="form-group">
                <label for="role">Role *</label>
                <select id="role" name="role" required>
                    <option value="">-- Select Role --</option>
                    <option th:each="role : ${roles}"
                            th:value="${role.name()}"
                            th:text="${role.name()}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Register User</button>
                <a th:href="@{/admin/users}" class="btn btn-outline">Cancel</a>
            </div>

        </form>
    </div>

</main>

</body>
</html>
