<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Smart Surveillance System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="login-card">

        <!-- Header -->
        <div class="login-header">
            <div class="login-icon">🔒</div>
            <h1>Smart Surveillance System</h1>
            <p class="login-subtitle">Criminal Face Detection | LNCT University</p>
        </div>

        <!-- Error / Logout Messages -->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>

        <!-- Login Form — action="/login" is handled by Spring Security -->
        <form th:action="@{/login}" method="post" class="login-form">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       required
                       autofocus/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required/>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Login to System
            </button>
        </form>

        <p class="login-footer">
            Authorized personnel only.<br/>
            Unauthorized access is strictly prohibited.
        </p>
    </div>
</div>

</body>
</html>
