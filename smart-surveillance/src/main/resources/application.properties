# --- Server ---
server.port=8080

# --- MySQL Database Configuration ---
# Change username, password, and DB name as per your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/surveillance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=saksham
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- File Upload (criminal photos) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Directory where criminal photos will be stored on disk
app.upload.dir=src/main/resources/static/uploads/criminals/

# --- OpenCV Native Library ---
# Windows example: C:/opencv/build/java/x64/opencv_java490.dll
# Linux example:   /usr/local/lib/libopencv_java490.so
# Set this path to where your OpenCV native library (.dll or .so) is located
app.opencv.native-lib-path=C:/opencv/build/java/x64/opencv_java490.dll


# --- Camera Stream ---
# Device index 0 = default webcam. Use 1, 2 for external cameras.
app.camera.device-index=0
app.camera.location=Main Gate
app.camera.detection-every-n-frames=8
app.detection.match-threshold=0.56
app.detection.min-score-gap=0.08
app.detection.scan-match-threshold=0.56
app.detection.scan-min-score-gap=0.06
app.detection.use-visual-score=false
app.detection.use-lbph=false
app.detection.lbph-threshold=70.0
app.detection.lbph-strict-confidence=62.0
app.detection.lbph-scan-confidence=65.0

# --- Logging ---
logging.level.com.surveillance=DEBUG
logging.level.org.springframework.security=INFO
